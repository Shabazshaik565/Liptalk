version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: liptalk_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: liptalk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: liptalk_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: liptalk_coturn
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "49152-49162:49152-49162/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/turnserver.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
